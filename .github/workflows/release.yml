name: Release

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  select-mode:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      mode: ${{ steps.select.outputs.mode }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          cache: pnpm
      - name: Configure GitHub Packages access
        run: npm config set //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: changesets/action/select-mode@v2
        id: select

  version:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          cache: pnpm
      - name: Configure GitHub Packages access
        run: npm config set //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: changesets/action/version@v2
        with:
          pr-title: Release
          commit-message: Release

  publish:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          cache: pnpm
      - name: Configure GitHub Packages access
        run: npm config set //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Read web version
        id: package
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - run: pnpm run routes:emit
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          context: .
          file: Dockerfile
          push: true
          secret-envs: NODE_AUTH_TOKEN=NODE_AUTH_TOKEN
          tags: ghcr.io/${{ github.repository_owner }}/${{ steps.package.outputs.name }}:${{ steps.package.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}-routes-${{ steps.package.outputs.version }}
          path: dist/routing-manifest/*
          if-no-files-found: error
      - uses: changesets/action/publish@v2
        id: changesets
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: pnpm release --no-git-tag
          create-github-releases: false
          push-git-tags: false
      - name: Create repository release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          git tag "$RELEASE_TAG"
          git push origin "$RELEASE_TAG"
          gh release create "$RELEASE_TAG" \
            "dist/routing-manifest/${{ steps.package.outputs.name }}-routes-${VERSION}.json" \
            "dist/routing-manifest/${{ steps.package.outputs.name }}-routes-${VERSION}.json.sha256" \
            --title "$RELEASE_TAG" \
            --generate-notes
      - name: Record release artifacts
        env:
          RELEASE_TAG: ${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          echo "Web release: $RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "Web image: ghcr.io/${{ github.repository_owner }}/${{ steps.package.outputs.name }}@${{ steps.image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
