server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  location /assets/ { try_files $uri =404; add_header Cache-Control "public, immutable" always; }
  location = /index.html { add_header Cache-Control "no-store" always; }
  location / { try_files $uri $uri/ /index.html; }
}
